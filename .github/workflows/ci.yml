# REL-009 E9.7 (branch-gated CI, confirmed reduced scope): Phase_13_Testing_Strategy.md's
# TEST-020..024 gate table describes a full feature -> develop -> release/* -> main GitFlow
# pipeline. This repo has only ever used a single `main` branch in practice (confirmed via
# `git log` -- no develop/release/*/hotfix/* branches exist or are used) -- inventing that
# multi-branch structure now would be process theater for a project with no team of reviewers
# to run it. The real new gates below (security scanning, coverage threshold) are added as
# steps in this same single job instead, which every push to `main` still goes through for
# real. That table stays as aspirational documentation for a future multi-contributor phase,
# not implemented here.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans full history, not just the current checkout

      - name: gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Build app image
        run: docker compose build app

      - name: Start dependencies
        # vault-unsealer is required, not optional: since REL-015 `vault` runs in real server
        # mode (file storage, docker-compose.yml's own `vault` service) and starts sealed on
        # every fresh container -- only `vault-unsealer` (scripts/vault_auto_unseal.py) performs
        # the real init/unseal. Omitting it here left Vault's own `/v1/sys/health` returning
        # 501/503 (uninitialized/sealed) forever, hanging the "Wait for Vault" step below
        # indefinitely -- confirmed as the real, reproducible root cause of every recent CI run
        # showing `conclusion: cancelled` (REL-078 through REL-082), not a flaky runner.
        # `minio` is also required here, not optional: src/core/audit_archive.py's
        # `ensure_bucket()` self-heals the WORM bucket the first time anything archives an audit
        # row, but only if the MinIO server itself is reachable -- this job never started it at
        # all before, failing every audit-archive test with a real connection error, not a
        # missing-bucket error.
        run: docker compose up -d postgres qdrant redis temporal vault vault-unsealer minio

      - name: Wait for Postgres
        run: |
          until docker compose exec -T postgres pg_isready -U tradingos; do sleep 2; done

      - name: Wait for Vault
        run: |
          until curl -sf http://localhost:8200/v1/sys/health; do sleep 2; done

      - name: Wait for Temporal
        run: |
          until curl -sf http://localhost:8233 > /dev/null; do sleep 2; done

      - name: Wait for MinIO
        run: |
          until curl -sf http://localhost:9000/minio/health/live > /dev/null; do sleep 2; done

      - name: Ruff lint
        run: docker compose run --rm app ruff check src tests

      - name: Black format check
        run: docker compose run --rm app black --check src tests

      - name: mypy strict
        run: docker compose run --rm app mypy src

      - name: Bandit (SAST)
        run: docker compose run --rm app bandit -c pyproject.toml -r src

      - name: pip-audit (dependency CVE scan)
        run: docker compose run --rm app pip-audit

      - name: Alembic migrations apply cleanly
        run: docker compose run --rm app alembic upgrade head

      - name: Ensure the Vault Transit signing key exists
        run: |
          docker compose run --rm app python -c "
          from src.core.config import get_settings
          from src.core.vault_transit import ensure_transit_key
          ensure_transit_key(get_settings())
          "

      - name: Ensure the Vault KV secrets engine exists
        # Found investigating a real, reproduced 102-test failure spanning webhooks/MFA/LLM-
        # key/Vault-round-trip tests: `ensure_kv_engine()` (src/core/vault.py) is only ever
        # called from the real FastAPI `lifespan()` (src/api/main.py), which never runs in this
        # job -- every step above is a one-off `docker compose run --rm app <command>`, never a
        # real persistent `app` server start. Real server-mode Vault (REL-015) mounts no KV
        # engine by default (`-dev` mode used to auto-mount one), so every _read_secret/
        # _write_secret call 404'd until this ran -- confirmed directly via
        # test_settings_api.py's own real assertion (`kv_engine_mounted is True`), which was
        # failing. Same idempotent-on-every-run shape as the Transit step above.
        run: |
          docker compose run --rm app python -c "
          from src.core.config import get_settings
          from src.core.vault import ensure_kv_engine
          ensure_kv_engine(get_settings())
          "

      - name: Bootstrap the real Qdrant collections
        # Found in the same 102-failure investigation as the two Vault steps above:
        # src/memory/collections.py's bootstrap_collections() is only ever invoked by
        # scripts/seed_admin_user.py-adjacent manual tooling or a real running app instance's
        # own startup path -- never by anything in this job before now. A fresh CI Qdrant has
        # zero collections, failing every agent-memory/strategy-similarity/news-sentiment test
        # with a real "Collection doesn't exist" error, not a data-emptiness assertion.
        # Idempotent (checks each collection's existence before creating), same shape as the
        # Vault Transit/KV steps above.
        #
        # EMBEDDING_PROVIDER=local (here and in Pytest below): src/memory/embeddings.py's own
        # module docstring names this exact provider as "the default for any environment where
        # neither the account-tier gate [HuggingFace] nor local Ollama reliability can be
        # assumed" -- CI is exactly that environment. The real default (settings.embedding_
        # provider="ollama") points at OLLAMA_BASE_URL=http://host.docker.internal:11434, a
        # Docker-Desktop-only convenience hostname with no Ollama server behind it on a
        # GitHub-hosted runner -- confirmed via a real CI run failing 12 memory/Qdrant/RAG tests
        # on "httpcore.ConnectError: [Errno -2] Name or service not known". "local" runs
        # sentence-transformers' all-MiniLM-L6-v2 in-process on CPU (already a real, non-optional
        # pyproject.toml dependency) -- no network dependency, no billing gate, dim=384 instead
        # of Ollama's dim=768, which is why this must be set before the bootstrap step too (the
        # collections it creates must match whatever Pytest will actually embed with).
        run: docker compose run --rm -e EMBEDDING_PROVIDER=local app python -m src.memory.collections

      - name: Generate the dev TLS cert for app-tls
        # scripts/generate_dev_tls_cert.py's own docstring: idempotent (no-ops if
        # certs/server.crt already exists), and docker-compose.yml's own `app-tls` comment says
        # outright this must be "run it once before starting this service, it's not generated
        # automatically here." A fresh CI checkout has no certs/ directory at all (gitignored,
        # correctly -- private keys don't belong in source control), so `app-tls` below would
        # otherwise crash-loop on startup with a real "[Errno 2] No such file or directory:
        # '/app/certs/server.key'" from uvicorn's own --ssl-keyfile flag.
        run: docker compose run --rm app python scripts/generate_dev_tls_cert.py

      - name: Start app and app-tls (real Prometheus scrape targets)
        # Found investigating the real "tradingos-app target health == down" failures in
        # test_prometheus_scrape.py: this job never started either persistent server before --
        # every other step above is a one-off `docker compose run --rm app <command>`, which
        # exits immediately and exposes nothing for Prometheus to scrape. Safe to start only
        # now: Postgres/Vault/Qdrant/MinIO are already up, Alembic has already created the
        # `tradingos_app` role both servers connect as, and Vault's Transit key + KV mount
        # (needed by `app`'s own FastAPI lifespan) are already ensured by the two steps above.
        run: docker compose up -d app app-tls prometheus

      - name: Wait for app and app-tls to serve a real /health 200
        run: |
          until curl -sf http://localhost:8001/health > /dev/null; do sleep 2; done
          until curl -skf https://localhost:8443/health > /dev/null; do sleep 2; done

      - name: Wait for Prometheus to report both scrape targets up
        # No retry loop inside test_prometheus_scrape.py itself (a single httpx.get) -- this
        # gate exists so that test isn't a coin-flip on whether Prometheus's own 15s scrape
        # interval (monitoring/prometheus.yml) has elapsed yet by the time Pytest reaches it.
        run: |
          until [ "$(curl -sf http://localhost:9090/api/v1/targets | jq '[.data.activeTargets[] | select(.labels.job | startswith("tradingos-app")) | select(.health == "up")] | length')" = "2" ]; do sleep 2; done

      - name: Seed the real admin user
        run: docker compose run --rm app python scripts/seed_admin_user.py

      - name: Seed the real Paper trading account
        # Found in the same investigation: scripts/paper_account.py's own get_paper_account()
        # raises a real, explicit RuntimeError ("No seeded Paper account found") when none
        # exists -- this local dev host has had one real seeded account since REL-034
        # (2026-08-12), but a fresh CI Postgres starts with none, failing every test that
        # touches paper trading (account summary, daily signal job, paper execution pipeline,
        # orders). Idempotent (finds the existing row rather than duplicating it); requires the
        # admin user seeded just above.
        run: docker compose run --rm app python scripts/seed_paper_account.py

      - name: Seed real historical market data for data-dependent tests
        # Found in the same 102-failure investigation as the Vault/paper-account steps above, and
        # confirmed by a first real CI run of this job (commit b03f6e7) that only seeded TCS/
        # ^NSEI: a real, documented 5-symbol window is required, not just TCS --
        # test_corporate_actions_backtest_diff.py's own module docstring states it plainly ("the
        # real data lake's real coverage window (2023-07-21..2024-07-19, 5 real symbols --
        # confirmed live against this exact Docker stack)"), and test_market_data_router.py's own
        # comment names all 5 (RELIANCE/TCS/INFY/HDFCBANK/ICICIBANK) plus ^NSEI. Without RELIANCE/
        # INFY/HDFCBANK/ICICIBANK, that first CI run's own real failures showed exactly this gap:
        # test_market_data_router.py failing "assert 'RELIANCE' in ['TCS', '^NSEI']", and
        # test_daily_signal_job.py's F&O tests failing on "no historical data ingested for INFY".
        # `--source managed` transparently runs yfinance alone in this job (build_market_data_
        # manager()'s own documented graceful degradation -- no Upstox secret is configured here,
        # matching production's real Upstox-then-yfinance failover, not a CI-only workaround).
        # Idempotent (the writer de-duplicates on (symbol, date), same as every other real
        # ingestion path in this repo).
        run: |
          docker compose run --rm app python -m src.data.ingest.pipeline \
            --source managed --symbols RELIANCE,TCS,INFY,HDFCBANK,ICICIBANK \
            --start 2023-07-21 --end 2024-07-19
          docker compose run --rm app python -m src.data.ingest.pipeline \
            --source yfinance --symbols ^NSEI --start 2023-07-21 --end 2024-07-19

      - name: Pytest
        run: |
          docker compose run --rm -e EMBEDDING_PROVIDER=local app \
            pytest --cov=src --cov-report=xml --cov-report=json

      - name: Per-module coverage gate
        run: docker compose run --rm app python scripts/module_coverage.py check

      - name: Mutation testing (Risk Manager / Kill Switch only)
        # REL-009 E9.5: real, verified gap, not a fabricated pass. mutmut 3.6.0's own trampoline
        # hit-tracking (mutmut/__main__.py::record_trampoline_hit) asserts a mutated module's
        # dotted name must never start with "src." -- real, reproduced against this exact repo
        # (see [tool.mutmut] above): src/engine/risk/kill_switch_service.py's `_kill_switch =
        # MaxDrawdownKillSwitch(...)` module-level singleton (a deliberate design choice, see
        # that file's own docstring -- "there is exactly one kill switch for the whole system,
        # not one per request") gets instrumented and instantiated at import time, tripping that
        # assertion every run. The fix would be either abandoning this project's own deliberate
        # `src.`-prefixed import convention (pyproject.toml's [tool.ruff.lint.isort] comment
        # explains why that convention was chosen) or making the Kill Switch's singleton lazy
        # purely to satisfy a test tool -- neither is an acceptable trade for the single most
        # safety-critical module in the system. Confirmed via real GitHub issues (boxed/mutmut
        # #485 -- another src-layout project hitting an unexplained crash on its initial run)
        # that this is a known-fragile area of mutmut's src-layout support, not a config mistake
        # here. `continue-on-error` so this doesn't permanently block CI on a tool limitation
        # unrelated to code quality -- Phase_13 TEST-002's 100%-mutation-kill requirement for
        # the Risk Manager/Kill Switch remains a real, documented, NOT-yet-satisfied gap (not
        # silently marked done) until mutmut fixes this upstream or a real workaround is found.
        continue-on-error: true
        run: docker compose run --rm app mutmut run

      - name: Tear down
        if: always()
        run: docker compose down -v

  build-and-push:
    # REL-009 E9.7 (CD pipeline, confirmed reduced scope): image build + git-SHA tag + registry
    # push only -- no real `kubectl apply`/Helm install step follows this. This host's Docker VM
    # is already memory-constrained (repeated real OOM crashes observed this session under
    # REL-008's ML dependency load); standing up a real kind/minikube cluster here risks the same
    # pattern. GHCR (not a third-party registry) needs no new secret -- pushes with the run's own
    # `GITHUB_TOKEN`. Gated on `lint-type-test` passing and only on push to `main` (not PRs, not
    # pushes to `develop`) -- a real image is only published once a change has cleared every gate.
    needs: lint-type-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tradingos:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/tradingos:latest

  helm-lint:
    # REL-009 E9.7: validates the new k8s/tradingos/ Helm chart without needing a real cluster --
    # `helm lint`/`helm template` both work with zero cluster access. Proves the chart is real and
    # valid, honestly not deployed anywhere yet (per the confirmed CD scope decision above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: helm lint
        run: docker run --rm -v "${{ github.workspace }}/k8s/tradingos:/chart" alpine/helm:latest lint /chart

      - name: helm template
        run: docker run --rm -v "${{ github.workspace }}/k8s/tradingos:/chart" alpine/helm:latest template /chart

  cypress-e2e:
    # REL-009 E9.6: a separate job (not a step in lint-type-test above) since it needs the real
    # frontend + app stack running together, and Cypress's own Electron binary needs its own
    # container (cypress/included) rather than being baked into either the lean Alpine `app` or
    # `frontend` images -- same "one-shot external tool container" pattern already used for
    # gitleaks. Runs on every push, same as the main job (not gated behind it, so a lint/type
    # failure doesn't hide a real E2E regression or vice versa).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app and frontend images
        run: docker compose build app frontend

      - name: Start Vault and Postgres first
        # vault-unsealer required -- see lint-type-test job's own "Start dependencies" step for
        # the full real root-cause explanation (Vault starts sealed in real server mode since
        # REL-015; without this, "Wait for Vault" below hangs forever).
        run: docker compose up -d postgres qdrant redis temporal vault vault-unsealer

      - name: Wait for Postgres
        run: |
          until docker compose exec -T postgres pg_isready -U tradingos; do sleep 2; done

      - name: Wait for Vault
        # `app`'s real FastAPI lifespan calls ensure_transit_key() at startup and fails closed
        # if Vault isn't reachable (REL-007) -- must be ready before starting `app` below.
        run: |
          until curl -sf http://localhost:8200/v1/sys/health; do sleep 2; done

      - name: Alembic migrations apply cleanly
        # Found investigating a real, reproduced failure: this job never ran migrations at all,
        # so the real non-superuser `tradingos_app` Postgres role (REL-014 E14.1, created by
        # migration u2v3w4x5y6z7 -- the role `app`'s own DATABASE_URL and every seed script below
        # connect as) never existed against this job's fresh CI Postgres, failing with a real
        # "password authentication failed for user tradingos_app" the first time anything tried
        # to connect. Matches lint-type-test's own already-proven step; must run before starting
        # `app` below, which connects as this same role at its own FastAPI-lifespan startup.
        run: docker compose run --rm app alembic upgrade head

      - name: Sync the real NSE instrument master
        # Found via the same real CI run's Cypress failures: "Instruments tab searches the real,
        # locally-synced Upstox instrument master" and the symbol-override combobox spec both
        # search src/models/instrument.py's `instruments` table directly (src/api/routers/
        # market_data.py's search_instruments_endpoint), which this job never populated -- a
        # fresh CI Postgres has zero rows there. A public, unauthenticated Upstox static file
        # download (instrument_sync.py's own module docstring) -- no broker credential needed,
        # same graceful-degradation shape as the OHLCV pipeline below.
        run: docker compose run --rm app python -m src.data.ingest.instrument_sync --exchange NSE

      - name: Seed real historical market data for data-dependent specs
        # This job doesn't share a runner or a Postgres/data-lake volume with lint-type-test's
        # own identically-named step -- each job gets a fresh checkout and fresh containers, so
        # the same real gap applies here independently. Found via the same real CI run's Cypress
        # failures: Market Analysis's "expected 0 to be above 0", and Backtests dashboard/
        # Candlestick chart specs failing on missing RELIANCE (and friends) real OHLCV data. Same
        # real 5-symbol + ^NSEI window as lint-type-test's own step -- see that step's comment for
        # the full citation trail.
        run: |
          docker compose run --rm app python -m src.data.ingest.pipeline \
            --source managed --symbols RELIANCE,TCS,INFY,HDFCBANK,ICICIBANK \
            --start 2023-07-21 --end 2024-07-19
          docker compose run --rm app python -m src.data.ingest.pipeline \
            --source yfinance --symbols ^NSEI --start 2023-07-21 --end 2024-07-19

      - name: Start app and frontend
        # NEXT_PUBLIC_API_BASE_URL override: real, confirmed root cause of every Cypress
        # login-flow failure this session -- the default (http://localhost:8001, correct for a
        # real host browser) is unreachable from inside the Cypress container's own network
        # namespace, where "localhost" resolves to that container itself, not `app`. See
        # docker-compose.yml's own comment on this same var for the full story.
        run: NEXT_PUBLIC_API_BASE_URL=http://app:8000 docker compose up -d app frontend

      - name: Seed the real admin user Cypress logs in as
        run: docker compose exec -T app python scripts/seed_admin_user.py

      - name: Seed the real Strategies-page fixture strategies (REL-044/045/046)
        run: docker compose exec -T app python scripts/seed_strategies_cypress_fixtures.py

      - name: Wait for the frontend to serve a real 200
        run: |
          until curl -sf http://localhost:3000/login > /dev/null; do sleep 2; done

      # cypress/included, real Debian/Electron binary -- avoids the real Alpine/Debian binary
      # mismatch found (this session, empirically) when reusing the frontend image's own
      # npm-installed Cypress. `tradingos_default` matches this repo's real compose project
      # name (the checkout directory's lowercased basename, "TradingOS" -> "tradingos") --
      # confirmed against the real network this project's own local dev stack creates.
      # `--entrypoint sh`: cypress/included's own image ENTRYPOINT is `cypress` itself -- without
      # this override, `sh -c "..."` is swallowed as an argument *to* cypress ("Cannot parse as
      # valid JSON" trying to read it as a --config value), not as the container's actual
      # command. Confirmed for real by running this exact invocation locally without the
      # override first (it failed exactly this way) -- this CI step had never actually been
      # exercised for real until now.
      - name: Run Cypress specs
        run: |
          docker run --rm --network tradingos_default \
            --shm-size=1g \
            --entrypoint sh \
            -v "${{ github.workspace }}/frontend:/e2e" \
            -w /e2e \
            -e CYPRESS_BASE_URL=http://frontend:3000 \
            -e CYPRESS_API_URL=http://app:8000 \
            cypress/included:14.5.4 \
            -c "npm ci && npx cypress run"

      - name: Tear down
        if: always()
        run: docker compose down -v
