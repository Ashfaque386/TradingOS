services:
  app:
    build: .
    image: tradingos-app:latest
    container_name: tradingos-app
    # Without this, a Docker Desktop backend crash (frequent on this machine -- see the
    # host-memory note on the `frontend` service below) silently leaves `app` and `frontend`
    # dead while postgres/qdrant/redis/temporal auto-recover, because those four already had
    # this policy and these two didn't. Matches the other four services.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      vault:
        condition: service_started
      vault-unsealer:
        condition: service_started
    environment:
      # REL-014 E14.1 (GLH-05): the app now runs as tradingos_app, a genuinely non-superuser
      # role (created by alembic/versions/u2v3w4x5y6z7) -- it cannot ALTER TABLE or disable the
      # audit_log trigger even from inside a compromised or malicious request, closing SEC-041's
      # real remaining gap ("a session connected as the table owner can still disable the
      # trigger"). Schema migrations still run as the schema-owning `tradingos` role, via the
      # separate MIGRATION_DATABASE_URL below -- never part of the running app's own connection.
      DATABASE_URL: postgresql+psycopg://tradingos_app:tradingos_app_dev_password@postgres:5432/tradingos
      MIGRATION_DATABASE_URL: postgresql+psycopg://tradingos:tradingos_dev_password@postgres:5432/tradingos
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      DATA_LAKE_ROOT: /app/data/lake
      # LLM inference (Phase 2+) uses the locally-installed Ollama on the host, not a cloud API key.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Local dev Vault (see the `vault` service below) -- src/core/vault.py falls back to .env
      # Settings if this is unreachable, so it's here but not a hard startup dependency.
      VAULT_ADDR: http://vault:8200
      # REL-015 E15.1: this fixed value is now only the fallback the entrypoint wrapper below
      # falls back to if the real, dynamically-generated root token isn't available yet -- see
      # scripts/docker-entrypoint-with-vault-token.sh.
      VAULT_TOKEN: dev-only-root-token
    ports:
      # Host port moved off the default 8000: another unrelated project on this machine
      # (dataops_backend / ai_data_automation-backend) already binds host 0.0.0.0:8000,
      # which fails `docker compose up` with "port is already allocated". The container's
      # internal port stays 8000 -- only the host-side mapping changed.
      - "8001:8000"
    volumes:
      - .:/app
      - data_lake:/app/data/lake
    # REL-015 E15.1: reads the real Vault root token (generated by vault-unsealer's real
    # `vault operator init`) into VAULT_TOKEN before uvicorn starts -- see that script for why
    # this can no longer be a static env var above.
    entrypoint: ["sh", "scripts/docker-entrypoint-with-vault-token.sh"]
    # --reload-dir src: without it, uvicorn's file watcher recursively inotify-watches the
    # ENTIRE bind-mounted /app tree (.git, data/lake parquet files, __pycache__, .pytest_cache,
    # htmlcov, ...) -- thousands of files. After a Docker Desktop / WSL2 restart this reliably
    # crashed the container with "WatchfilesRustInternalError: Cannot allocate memory (os error
    # 12)" (inotify instance/watch limits exhausted), even though no port was actually in
    # conflict. Restricting the watch to `src` (the only directory that actually changes at
    # dev-reload time) fixes it.
    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "src",
      ]

  # REL-007 E7.6 (SEC-023/024, reduced local equivalent): real HTTPS via a self-signed dev CA
  # (scripts/generate_dev_tls_cert.py -- run it once before starting this service, it's not
  # generated automatically here). A NEW sibling service, not `app` itself converted to HTTPS,
  # because Uvicorn can only serve one of plain-HTTP or HTTPS per process, and `app`/:8001 is
  # what the frontend's NEXT_PUBLIC_API_BASE_URL already points at -- converting it in place
  # would break that with no migration path. RUN_SCHEDULER=false so this doesn't double-fire the
  # daily research cycle alongside `app` (both share the same Postgres/Redis).
  #
  # Deliberately NOT covered: internal service-mesh mTLS (SEC-024) assumes a Kubernetes +
  # Istio/Linkerd topology this project doesn't have and won't (Docker Compose only,
  # permanently) -- documented as N/A for this deployment shape, not approximated further.
  # Postgres/Redis/Qdrant/Vault-level TLS is also out of scope: every one of those connections
  # stays inside this single Docker bridge network on one host, never traversing the real
  # multi-host network segment SEC-023/024's threat model assumes.
  app-tls:
    image: tradingos-app:latest
    build: .
    container_name: tradingos-app-tls
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      vault:
        condition: service_started
      vault-unsealer:
        condition: service_started
    environment:
      # REL-014 E14.1: non-superuser runtime role -- see the `app` service's own comment above.
      DATABASE_URL: postgresql+psycopg://tradingos_app:tradingos_app_dev_password@postgres:5432/tradingos
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      DATA_LAKE_ROOT: /app/data/lake
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      VAULT_ADDR: http://vault:8200
      # REL-015 E15.1: fallback only -- see the `app` service's own comment above.
      VAULT_TOKEN: dev-only-root-token
      RUN_SCHEDULER: "false"
      # REL-009 E9.4: `false` by default (real deployments never set this) -- lets a real ZAP
      # scan run (scripts/run_zap_scan.sh) be pointed at this real, deliberately-unsafe endpoint
      # via a shell env var override, without ever baking `true` into this file. See
      # Settings.zap_test_endpoint_enabled's own docstring (src/core/config.py).
      ZAP_TEST_ENDPOINT_ENABLED: ${ZAP_TEST_ENDPOINT_ENABLED:-false}
    ports:
      - "8443:8443"
    volumes:
      - .:/app
      - data_lake:/app/data/lake
    # REL-015 E15.1: see the `app` service's own matching comment above.
    entrypoint: ["sh", "scripts/docker-entrypoint-with-vault-token.sh"]
    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8443",
        "--ssl-keyfile",
        "/app/certs/server.key",
        "--ssl-certfile",
        "/app/certs/server.crt",
        "--reload",
        "--reload-dir",
        "src",
      ]

  # `image:` names below are given an explicit `tradingos-` prefix (matching `tradingos-app`)
  # via a trivial one-line `FROM <upstream>` build, so `docker images` reads consistently
  # instead of mixing bare upstream names (postgres:16-alpine, qdrant/qdrant, ...) with the
  # locally-built app image. The build is a single cached FROM layer -- effectively free.
  postgres:
    image: tradingos-postgres:16-alpine
    build:
      dockerfile_inline: "FROM postgres:16-alpine"
    container_name: tradingos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradingos
      POSTGRES_PASSWORD: tradingos_dev_password
      POSTGRES_DB: tradingos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingos"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: tradingos-qdrant:latest
    build:
      dockerfile_inline: "FROM qdrant/qdrant:latest"
    container_name: tradingos-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: tradingos-redis:7-alpine
    build:
      dockerfile_inline: "FROM redis:7-alpine"
    container_name: tradingos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Real, single-node Temporal server (`temporal server start-dev`): in-memory persistence
  # (no --db-filename -- the mounted-volume SQLite path hit a container permission/OOM error
  # opening the file, and dev-server data doesn't need to survive a restart anyway) + Web UI.
  # Chosen over a distributed/Kubernetes-backed Temporal cluster per the Phase 3 E3.3 decision
  # -- sufficient for a single-node Monte Carlo workflow (Phase_3_Low_Level_Design.md §7).
  temporal:
    image: tradingos-temporal:latest
    build:
      dockerfile_inline: "FROM temporalio/temporal:latest"
    container_name: tradingos-temporal
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--ui-port", "8233"]
    ports:
      - "7233:7233"
      - "8233:8233"

  # REL-005 E5.3: a standing consumer for MonteCarloWorkflow (src/workers/monte_carlo_workflow.py).
  # Before this, the workflow was only ever exercised by test_monte_carlo_workflow.py's own
  # throwaway in-process Worker -- nothing in production ever ran one, so the Optimization Agent
  # node's real `execute_workflow` call would hang forever with nothing registered on
  # `settings.temporal_task_queue` to pick up the task. Same image as `app` (identical codebase/
  # dependencies), different entrypoint.
  monte-carlo-worker:
    image: tradingos-app:latest
    build: .
    container_name: tradingos-monte-carlo-worker
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_started
      vault-unsealer:
        condition: service_started
    environment:
      # REL-014 E14.1: non-superuser runtime role -- see the `app` service's own comment above.
      DATABASE_URL: postgresql+psycopg://tradingos_app:tradingos_app_dev_password@postgres:5432/tradingos
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      DATA_LAKE_ROOT: /app/data/lake
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      VAULT_ADDR: http://vault:8200
      # REL-015 E15.1: fallback only -- see the `app` service's own comment above.
      VAULT_TOKEN: dev-only-root-token
    volumes:
      - .:/app
      - data_lake:/app/data/lake
    # REL-015 E15.1: see the `app` service's own matching comment above.
    entrypoint: ["sh", "scripts/docker-entrypoint-with-vault-token.sh"]
    command: ["python", "-m", "src.workers.monte_carlo_worker"]

  # REL-015 E15.6 (GLH-12): standing continuous tick publisher -- see
  # src/workers/tick_publisher.py's own module docstring for the full design (real REST-polled
  # quotes during real NSE market hours, published to the same Redis channel the frontend's
  # candlestick chart already relays from; not a real broker WebSocket feed, an honestly-scoped
  # reduction from that).
  tick-publisher:
    image: tradingos-app:latest
    build: .
    container_name: tradingos-tick-publisher
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      vault-unsealer:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://tradingos_app:tradingos_app_dev_password@postgres:5432/tradingos
      REDIS_URL: redis://redis:6379/0
      DATA_LAKE_ROOT: /app/data/lake
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-only-root-token
    volumes:
      - .:/app
      - data_lake:/app/data/lake
    entrypoint: ["sh", "scripts/docker-entrypoint-with-vault-token.sh"]
    command: ["python", "-m", "src.workers.tick_publisher"]

  # Local Vault (Phase 4 E4.1 exit criterion: "Wire Vault-issued short-lived tokens for broker
  # API key retrieval"). Originally stood up in `-dev` mode (in-memory storage, auto-unsealed,
  # fixed root token) -- real Vault infrastructure and a real client against it, but with
  # dev-mode's own well-documented simplifications. REL-015 E15.1 below replaced dev mode with a
  # real, persistent server config; the Transit engine (JWT signing keys, SEC-011) and key
  # rotation (SEC-011 90-day rotation) remain the same real-but-reduced pattern described in
  # src/core/vault.py's module docstring.
  # REL-015 E15.1 (GLH-01): real server config (docker/vault/config.hcl, `file` storage
  # backend) replacing `-dev` mode -- dev mode is always in-memory by Vault's own design, so
  # GLH-01 ("Vault survives a restart with persistent storage") could never be closed while
  # running it. A real Vault genuinely starts "sealed" after every restart -- see the
  # `vault-unsealer` service below, which is what makes that automatic here.
  vault:
    image: tradingos-vault:latest
    build:
      dockerfile_inline: "FROM hashicorp/vault:latest"
    container_name: tradingos-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    # Prefixed with the literal "vault" binary name, NOT just "server": the official image's
    # own docker-entrypoint.sh unconditionally rewrites a bare `server` first-arg into
    # `vault server -config="$VAULT_CONFIG_DIR" -dev-root-token-id=... -dev-listen-address=...`
    # (real, confirmed by reading /usr/local/bin/docker-entrypoint.sh inside the image) --
    # always injecting a SECOND, dev-mode listener on the same port regardless of what real
    # config is also passed, which crash-loops with "address already in use" once both listeners
    # (dev-mode's implicit one and this real config's own) try to bind 0.0.0.0:8200 in the same
    # process. Starting with "vault" instead skips that whole rewrite branch while still getting
    # the entrypoint's real setcap/mlock/su-exec handling for IPC_LOCK.
    command: ["vault", "server", "-config=/vault/config/config.hcl"]
    volumes:
      - ./docker/vault/config.hcl:/vault/config/config.hcl:ro
      - vault_data:/vault/file
    ports:
      - "8200:8200"

  # REL-015 E15.1: standing auto-unseal daemon for the `vault` service above -- see
  # scripts/vault_auto_unseal.py's own module docstring for the full design (real init on first
  # run, real unseal on every subsequent run/restart, and the accepted single-operator
  # tradeoffs). Uses the same app image (already has hvac + this repo importable) with a
  # different entrypoint; shares /app with `app`/`app-tls`/`monte-carlo-worker` via the same
  # bind mount they already use, so the keys file it writes to ./vault/keys/ needs no extra
  # volume wiring to be readable by those services' own entrypoint wrapper.
  vault-unsealer:
    image: tradingos-app:latest
    build: .
    container_name: tradingos-vault-unsealer
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_started
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - .:/app
    entrypoint: ["python", "scripts/vault_auto_unseal.py"]

  # REL-015 E15.3 (GLH-06, SEC-039): WORM audit archive tier. MinIO's S3-compatible API
  # supports real Object Lock (the same mechanism AWS S3 Object Lock uses), giving AUDIT_LOG a
  # second, independent immutability layer on top of -- not instead of -- the existing Postgres
  # trigger-based protection (src/models/audit.py). The bucket itself is created with Object
  # Lock enabled by src/core/audit_archive.py's `ensure_bucket()` (self-healing, same pattern as
  # vault.py's `ensure_kv_engine()`), not here -- Object Lock can only be set at bucket-creation
  # time via the API, not via a compose/env setting.
  minio:
    image: tradingos-minio:latest
    build:
      dockerfile_inline: "FROM minio/minio:latest"
    container_name: tradingos-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: tradingos-minio-admin
      MINIO_ROOT_PASSWORD: tradingos_minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # REL-008's MLflow tracking server was removed 2026-07-30 alongside the rest of the ML/RL
  # platform (Phase 5), disabled pending a host resource upgrade -- see
  # Phase_5_Machine_Learning_Architecture.md's own status banner. Re-add when Phase 5 is
  # re-implemented (git history has the full original service definition).

  # REL-009 E9.1: real Prometheus, scraping the real /metrics endpoint that has existed since
  # Phase 4 (src/observability/metrics.py) but had nothing scraping it until now.
  prometheus:
    image: tradingos-prometheus:latest
    build:
      dockerfile_inline: "FROM prom/prometheus:latest"
    container_name: tradingos-prometheus
    restart: unless-stopped
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
        "--storage.tsdb.retention.time=15d",
      ]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  # REL-009 E9.1: real Grafana, provisioned as code (datasource + dashboard JSON both auto-
  # loaded on startup -- no manual click-through setup). Default admin/admin credentials are
  # dev-only, matching this project's other dev-mode-only services (Vault -dev, self-signed TLS).
  grafana:
    image: tradingos-grafana:latest
    build:
      dockerfile_inline: "FROM grafana/grafana:latest"
    container_name: tradingos-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # REL-020 E20.2: real Slack Incoming Webhook URL, read from the host .env (gitignored,
      # never committed) and expanded into the alerting contact-point provisioning YAML via
      # Grafana's own $__env{...} syntax -- see monitoring/grafana/provisioning/alerting/.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      # Host 3001 -- 3000 is already bound by `frontend`.
      - "3001:3000"

  # Next.js dashboard (Phase 4 E4.3, Phase_7_Frontend_Architecture.md). Port 3000 confirmed
  # free against every other project running on this machine.
  frontend:
    build: ./frontend
    image: tradingos-frontend:latest
    container_name: tradingos-frontend
    # This host has only ~11.8GB RAM shared across containers from several unrelated projects
    # (trading_v2's Kafka/ClickHouse/Grafana stack, dataops_*, trading_bot) -- under memory
    # pressure Docker Desktop's backend periodically crashes and silently restarts every
    # container. Without a restart policy, `app`/`frontend` stayed dead afterward while
    # everything else self-healed. This isn't a fix for the crashes themselves (that needs
    # freeing host RAM -- stop unrelated projects' containers when not using them), just for
    # the stack failing to come back up on its own once Docker recovers.
    restart: unless-stopped
    environment:
      # Read by the BROWSER (Next.js only exposes NEXT_PUBLIC_* vars client-side), so this must
      # be the host-exposed port, not the in-network "app:8000"/"app-tls:8443" hostname -- a
      # real host browser runs outside the docker network entirely. REL-009 E9.6: this default
      # breaks Cypress running *inside* the docker network (cypress/included's own browser
      # resolves "localhost" to its own container, not the host) -- confirmed for real, every
      # login.cy.ts test hung/failed on it. `${NEXT_PUBLIC_API_BASE_URL:-...}` lets the Cypress
      # CI job (and local Cypress runs) override this to `http://app:8000` via a shell env var
      # before `docker compose up frontend`, without changing the correct default for real dev
      # usage.
      #
      # REL-015 E15.2 (GLH-02): now defaults to the real-TLS `app-tls`:8443 service instead of
      # plain-HTTP `app`:8001 -- the main port GLH-02 asked to actually have TLS. One real,
      # one-time manual step this cutover requires (self-signed cert, no public CA): open
      # https://localhost:8443 directly in the browser once and accept the certificate warning
      # before the dashboard's own fetch()/WebSocket calls to that origin will succeed -- a
      # browser silently fails those the way curl -k would happily proceed, not something this
      # config can automate around.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://localhost:8443}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # node_modules as its own named volume, shadowing the bind mount above: installing
      # directly into a Windows-bind-mounted node_modules hits `ENOTEMPTY` on npm's atomic
      # rename-based install process (confirmed empirically, reproducible across multiple
      # packages) -- keeping node_modules entirely inside the Linux container/volume side-steps
      # it permanently. Source-only bind mount above still gives Next.js hot-reload on save.
      - frontend_node_modules:/app/node_modules
    depends_on:
      app:
        condition: service_started

volumes:
  postgres_data:
    name: tradingos_app_postgres_data
  qdrant_data:
    name: tradingos_app_qdrant_data
  redis_data:
    name: tradingos_app_redis_data
  data_lake:
    name: tradingos_app_data_lake
  frontend_node_modules:
    name: tradingos_app_frontend_node_modules
  # REL-015 E15.1 (GLH-01): real persistent storage for the `file` Vault backend
  # (docker/vault/config.hcl) -- the whole point of this epic, replacing dev mode's
  # always-in-memory storage.
  vault_data:
    name: tradingos_app_vault_data
  # REL-015 E15.3 (GLH-06, SEC-039): real persistent storage for the MinIO WORM audit archive --
  # must survive restarts, since the whole point is a durable second copy of AUDIT_LOG.
  minio_data:
    name: tradingos_app_minio_data
  prometheus_data:
    name: tradingos_app_prometheus_data
  grafana_data:
    name: tradingos_app_grafana_data
