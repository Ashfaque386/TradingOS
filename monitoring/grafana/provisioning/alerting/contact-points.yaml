# REL-020 E20.2: real Slack contact point, provisioned as code (same discipline as the
# datasource/dashboard provisioning above -- no manual click-through Grafana setup).
#
# The webhook URL is never written here in plaintext: `$__env{SLACK_WEBHOOK_URL}` is Grafana's
# own provisioning-time environment-variable expansion, reading the SLACK_WEBHOOK_URL env var
# that docker-compose.yml passes into the grafana container from the host's gitignored .env.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-downtime-alerts
    receivers:
      - uid: slack-downtime-webhook
        type: slack
        settings:
          url: $__env{SLACK_WEBHOOK_URL}
          title: '{{ template "default.title" . }}'
          text: '{{ template "default.message" . }}'
        disableResolveMessage: false
