# REL-009 E9.3: extends gitleaks' own default rule set (not a replacement -- an empty/absent
# `[[rules]]` table here means "use every built-in rule," only the allowlist below is added).
title = "TradingOS gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Deliberate, real, non-functional secret-pattern fixtures kept only to prove this same gate genuinely catches something real (see the REL-009 plan's Verification section) -- never real credentials."
paths = [
    '''tests/ci_fixtures/.*''',
]
# REL-017 E17.4: `monte_carlo_p95_max_drawdown` (a real DB-007 column/field name, src/api/
# routers/strategies.py's BacktestSummary) trips gitleaks' generic-api-key entropy heuristic --
# a real false positive on a real identifier, not a secret. Allowlisted by exact string rather
# than by path, since this name legitimately appears in both the Python model and the TS
# frontend type it mirrors.
# REL-068: same false positive, same reasoning, for `p95_duration_seconds` (a real
# AgentAnalyticsSummaryRow field, src/api/routers/agents.py, mirrored in
# frontend/src/components/agents/agent-success-rate-table.tsx).
regexes = [
    '''monte_carlo_p95_max_drawdown''',
    '''p95_duration_seconds''',
]
