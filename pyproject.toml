[project]
name = "tradingos"
version = "0.1.0"
description = "TradingOS - Enterprise AI Trading Operating System for Indian equity & F&O markets"
requires-python = ">=3.12"
# Kept intentionally lean: only what's needed by phases actually underway. `litellm` (E2.2),
# `langgraph`/`langchain-core` (E2.1), `vectorbt` (E3.2), `temporalio` (E3.3 Monte Carlo
# workflow), and `optuna` (E3.3 hyperparameter sweep) are each promoted into the base install
# as Phase work reaches them — see
# Phase_14_Master_Development_Roadmap.md. All installs happen inside the `app` image
# (see Dockerfile, python:3.12-slim) — nothing local.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "polars>=1.14",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "qdrant-client>=1.12",
    "redis>=5.2",
    "httpx>=0.27",
    "structlog>=24.4",
    # REL-007 E7.2: JWTs are now hand-built JWS (src/core/security.py) signed via Vault Transit
    # (src/core/vault_transit.py), not python-jose -- that dependency is gone. `cryptography` is
    # now a direct import (DER<->raw ECDSA signature conversion, local public-key verification),
    # not just a transitive dep of the removed python-jose[cryptography] extra.
    "cryptography>=43",
    # Not passlib[bcrypt]: passlib 1.7.4 (its last release) is broken against bcrypt>=4.1 (see
    # src/core/security.py's module docstring) -- calling the bcrypt package directly instead.
    "bcrypt>=4.1",
    "hvac>=2.3",  # HashiCorp's official Vault client (src/core/vault.py, src/core/vault_transit.py)
    # REL-007 E7.1 (MFA, SEC-014): TOTP generation/verification.
    "pyotp>=2.9",
    # REL-007 E7.5 (SEC-017): policy-file RBAC, replacing scattered `if role ==` checks.
    "casbin>=1.36",
    "yfinance>=0.2",
    "litellm>=1.52",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # ruff/black are also runtime agent tools here (Python Validator's run_linter(), Python
    # Code Generator's format_python_code() per Phase_4_AI_Agent_Design.md), not just dev/CI
    # tooling, so they live in base deps rather than the `dev` extra.
    "ruff>=0.7",
    "black>=24.10",
    # Phase 3 Epic E3.2 (VectorBT Backtesting Engine) -- promoted out of the `engine` extra,
    # same pattern as litellm/langgraph before it.
    "vectorbt>=0.26",
    # Phase 3 Epic E3.3 (Monte Carlo Temporal workflow) -- promoted out of the `agents` extra.
    "temporalio>=1.8",
    # Phase 3 Epic E3.3 (Optuna hyperparameter sweep for the Optimization Agent).
    "optuna>=4.0",
    # Phase 4 E4.2 (OpenTelemetry distributed tracing, Phase_8_DevOps_Architecture.md §5:
    # "A single trace ID follows a request from the Next.js frontend -> FastAPI -> Redis
    # Queue -> Execution Engine -> Broker API"). No OTLP collector is running yet -- the SDK
    # still creates/propagates real trace context without one configured (export is a separate,
    # optional concern, same pattern as LangSmith tracing).
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    # Phase 4 E4.2 (Prometheus WS-latency alerting, Phase_9_Master_Implementation_Guide.md §5
    # Risk Register).
    "prometheus-client>=0.21",
    # Phase 4 E4.3 Terminal UI (Phase_7_Frontend_Architecture.md §2.6): a real client of the
    # same FastAPI REST/WS surface the Next.js dashboard uses, not a second backend -- textual
    # for the TUI framework, websockets for the /stream/agents/logs client (httpx doesn't speak
    # WS).
    "textual>=0.85",
    "websockets>=13.0",
    # REL-005 E5.6 (Scheduler Agent, AGT-025). In-process APScheduler, not a Temporal Schedule --
    # the `temporal` compose service runs `start-dev` with in-memory persistence (no
    # --db-filename), so a Temporal Schedule object would vanish on every container restart,
    # which a simple daily cron trigger can't tolerate.
    "apscheduler>=3.10",
    # REL-005 live E2E verification (2026-07-25): a real, local "local" EMBEDDING_PROVIDER
    # (src/memory/embeddings.py) -- HuggingFace's hosted Inference API rejects every embedding
    # model for this free-tier account (isPro=false, canPay=false, an account gate confirmed
    # earlier in Phase 2 E2.4 and re-confirmed here), and the local Ollama embedding call was
    # unreliable on this machine. sentence-transformers runs the same all-MiniLM-L6-v2 model
    # in-process on CPU -- no external API, no billing gate, no network dependency at all.
    "sentence-transformers>=3.0",
    # REL-008's ML/RL platform dependencies (mlflow, lightgbm, torch, onnx, onnxruntime,
    # onnxmltools, gymnasium, stable-baselines3, scipy) were removed 2026-07-30, disabled
    # pending a host resource upgrade -- see Phase_5_Machine_Learning_Architecture.md's own
    # status banner and Phase_14_Master_Development_Roadmap.md's REL-008 section for why. This
    # is the real, direct cause of freeing meaningful RAM: these were the dominant driver of the
    # repeated Docker OOM crashes documented in REL-009's own session notes. Re-add when Phase 5
    # is re-implemented (git history has the exact original pinned versions).
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "testcontainers>=4.8",
    "types-PyYAML>=6.0",
    # [toml] extra needed for bandit to read the [tool.bandit] config in this file directly --
    # without it, bandit silently ignores pyproject.toml and the skip list below has no effect.
    "bandit[toml]>=1.7",
    "pandas-stubs>=2.0",
    # REL-009 E9.3: real CVE scanning against the actual installed dependency tree, as a real
    # CI gate -- chosen over Snyk since it needs no external account/API token to manage.
    "pip-audit>=2.7",
    # REL-009 E9.5: mutation testing, scoped to src/engine/risk/ only (see [tool.mutmut] below)
    # -- Phase_13_Testing_Strategy.md's TEST-002 100%-mutation-kill requirement is explicitly
    # scoped to the Risk Manager/Kill Switch module, not the whole codebase.
    "mutmut>=3.2",
    # REL-009 E9.6 (TEST-014 Performance Tests): tests/perf/locustfile.py's real load-test
    # client -- run manually inside the `app` container (`docker compose exec app locust ...`),
    # not a CI gate (see that file's own docstring for why).
    "locust>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Explicit, not auto-detected: this project imports its own code as `from src.xxx import yyy`
# (keeping the `src.` prefix), not the bare-package style ruff's src-layout auto-detection
# assumes. Without this, ruff auto-adds `src/` itself as an extra source root alongside the
# project root, which made whether `src.*` imports count as first-party or third-party depend
# on environment-specific auto-detection -- confirmed as the real cause of a CI-only Ruff
# failure (I001) that never reproduced in the local dev container: `ruff check --show-settings`
# revealed `linter.src = ["/app", "/app/src"]` locally, an ambiguous resolution GitHub Actions'
# fresh checkout resolved differently. Declaring `src` as first-party removes the ambiguity.
known-first-party = ["src"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection system requires `Depends(...)` as an argument default --
# it's a DI sentinel evaluated once per request by FastAPI itself, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# `mypy src` resolves the files passed on the command line by walking the file system, but
# resolves *imports found inside those files* (e.g. `from src.data.datalake.query import ...`)
# by checking where a real Python import would find them -- which, for this project's editable
# install (`pip install -e ".[dev]"`, see Dockerfile), goes through the generated
# `_editable_impl_tradingos.pth` finder in site-packages, not the local `/app/src` tree
# directly. That resolution proved environment-dependent: a real GitHub Actions run failed with
# "Cannot find implementation or library stub for module named src.data.datalake.query" for
# imports that resolved fine in the local dev container. Setting mypy_path to the project root
# plus explicit_package_bases makes mypy resolve `src.*` imports directly from the local file
# tree every time, regardless of the installed editable package's own resolution mechanism.
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vectorbt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hvac.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyotp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "casbin.*"
ignore_missing_imports = true

# REL-008's mypy overrides for mlflow/lightgbm/onnx/onnxruntime/onnxmltools/gymnasium/
# stable_baselines3/sklearn/scipy were removed 2026-07-30 -- none of those packages are
# dependencies anymore (the whole ML/RL platform they supported was disabled pending a host
# resource upgrade, see Phase_5_Machine_Learning_Architecture.md's own status banner).

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]

# REL-009 E9.5: mutation testing scoped to src/engine/risk/ ONLY -- Phase_13_Testing_Strategy.md's
# TEST-002 requires 100% mutation-kill specifically for the Risk Manager/hardcoded Kill Switch
# (safety-critical per Rule 1), not the whole codebase (which would take hours and isn't what the
# design doc actually asks for).
#
# mutmut 3.x's real config schema (confirmed against the installed mutmut==3.6.0's own
# mutmut.configuration.Config, empirically -- its `paths_to_mutate`/`tests_dir`/`runner` keys
# from older mutmut versions are silently deprecated, and `tests_dir` maps straight into
# `pytest_add_cli_args_test_selection`, which broadens test collection to the *entire* named
# directories, not a scoped file list). mutmut runs pytest inside an isolated `mutants/` sandbox
# containing only `source_paths` (+ the whole `tests/` tree, copied verbatim by mutmut's own
# hardcoded default) -- pointing test selection at whole directories there collects test files
# that import untouched sibling packages (e.g. `src.agents`) that were never copied into that
# sandbox, and collection fails. Naming the exact 3 real test files here (not a directory)
# avoids collecting anything outside this module's own real test scope.
[tool.mutmut]
source_paths = ["src/engine/risk/"]
# The 3 real scoped test files above import well beyond src/engine/risk/ (src.agents, src.brokers,
# src.core, src.engine.live, src.models -- confirmed by reading their real imports) -- mutmut's
# own setup_source_paths() (mutmut/__main__.py) fully shadows the real `src` with `mutants/src` on
# sys.path, so every sibling package those tests import must exist there too, unmutated. `also_copy`
# bulk-copies the whole real `src/` tree into the sandbox once, before any mutant is applied;
# `source_paths` above still controls which files actually get mutated/scored.
also_copy = ["src/"]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_node_risk_manager.py",
    "tests/unit/test_kill_switch.py",
    "tests/integration/test_execution_pipeline_compliance.py",
]

# REL-009 E9.3: a real, repo-wide `bandit -r src` CI gate (previously only ever run narrowly
# against src/engine/sandbox by one test). Every skip below was individually reviewed against a
# real bandit report (not a blanket suppression) -- each one is a genuinely low-risk, already-
# reviewed pattern already established elsewhere in this codebase, not an unexamined finding:
#   B101 (assert_used): every real hit is a pure type-narrowing/invariant assert (e.g.
#     `assert isinstance(self._broker, KiteConnectAdapter)`, `assert timestamp is not None`
#     immediately after the real signature-verification check already ran) -- never a security
#     enforcement check that `-O` stripping could bypass.
#   B110 (try_except_pass): only in the two WebSocket relay endpoints
#     (src/api/routers/streams.py) as the standard "client disconnected, stop relaying" pattern
#     -- a broad except is the correct behavior there, not a masked bug.
#   B404/B603/B607 (subprocess use / partial executable path): every real call site
#     (src/agents/tools/skills.py's `ruff check`, src/ml/training/orchestrator.py's
#     `git rev-parse HEAD`) uses a fixed argument list (no `shell=True`) with a non-user-
#     controlled executable name -- genuinely safe subprocess usage, not untrusted-input
#     execution.
# B608 (hardcoded_sql_expressions) is deliberately NOT in this list -- the two real findings it
# caught (src/data/datalake/query.py, src/ml/features/store.py) were genuine, now fixed via
# real DuckDB parameterized queries, not suppressed.
[tool.bandit]
skips = ["B101", "B110", "B404", "B603", "B607"]
