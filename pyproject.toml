[project]
name = "tradingos"
version = "0.1.0"
description = "TradingOS - Enterprise AI Trading Operating System for Indian equity & F&O markets"
requires-python = ">=3.12"
# Kept intentionally lean: only what's needed by phases actually underway. `litellm` (E2.2),
# `langgraph`/`langchain-core` (E2.1), `vectorbt` (E3.2), `temporalio` (E3.3 Monte Carlo
# workflow), and `optuna` (E3.3 hyperparameter sweep) are each promoted into the base install
# as Phase work reaches them — see
# Phase_14_Master_Development_Roadmap.md. All installs happen inside the `app` image
# (see Dockerfile, python:3.12-slim) — nothing local.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "polars>=1.14",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "qdrant-client>=1.12",
    "redis>=5.2",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    # Not passlib[bcrypt]: passlib 1.7.4 (its last release) is broken against bcrypt>=4.1 (see
    # src/core/security.py's module docstring) -- calling the bcrypt package directly instead.
    "bcrypt>=4.1",
    "hvac>=2.3",  # HashiCorp's official Vault client (src/core/vault.py)
    "yfinance>=0.2",
    "litellm>=1.52",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # ruff/black are also runtime agent tools here (Python Validator's run_linter(), Python
    # Code Generator's format_python_code() per Phase_4_AI_Agent_Design.md), not just dev/CI
    # tooling, so they live in base deps rather than the `dev` extra.
    "ruff>=0.7",
    "black>=24.10",
    # Phase 3 Epic E3.2 (VectorBT Backtesting Engine) -- promoted out of the `engine` extra,
    # same pattern as litellm/langgraph before it.
    "vectorbt>=0.26",
    # Phase 3 Epic E3.3 (Monte Carlo Temporal workflow) -- promoted out of the `agents` extra.
    "temporalio>=1.8",
    # Phase 3 Epic E3.3 (Optuna hyperparameter sweep for the Optimization Agent).
    "optuna>=4.0",
    # Phase 4 E4.2 (OpenTelemetry distributed tracing, Phase_8_DevOps_Architecture.md §5:
    # "A single trace ID follows a request from the Next.js frontend -> FastAPI -> Redis
    # Queue -> Execution Engine -> Broker API"). No OTLP collector is running yet -- the SDK
    # still creates/propagates real trace context without one configured (export is a separate,
    # optional concern, same pattern as LangSmith tracing).
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    # Phase 4 E4.2 (Prometheus WS-latency alerting, Phase_9_Master_Implementation_Guide.md §5
    # Risk Register).
    "prometheus-client>=0.21",
    # Phase 4 E4.3 Terminal UI (Phase_7_Frontend_Architecture.md §2.6): a real client of the
    # same FastAPI REST/WS surface the Next.js dashboard uses, not a second backend -- textual
    # for the TUI framework, websockets for the /stream/agents/logs client (httpx doesn't speak
    # WS).
    "textual>=0.85",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "testcontainers>=4.8",
    "types-PyYAML>=6.0",
    "bandit>=1.7",
    "pandas-stubs>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Explicit, not auto-detected: this project imports its own code as `from src.xxx import yyy`
# (keeping the `src.` prefix), not the bare-package style ruff's src-layout auto-detection
# assumes. Without this, ruff auto-adds `src/` itself as an extra source root alongside the
# project root, which made whether `src.*` imports count as first-party or third-party depend
# on environment-specific auto-detection -- confirmed as the real cause of a CI-only Ruff
# failure (I001) that never reproduced in the local dev container: `ruff check --show-settings`
# revealed `linter.src = ["/app", "/app/src"]` locally, an ambiguous resolution GitHub Actions'
# fresh checkout resolved differently. Declaring `src` as first-party removes the ambiguity.
known-first-party = ["src"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection system requires `Depends(...)` as an argument default --
# it's a DI sentinel evaluated once per request by FastAPI itself, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# `mypy src` resolves the files passed on the command line by walking the file system, but
# resolves *imports found inside those files* (e.g. `from src.data.datalake.query import ...`)
# by checking where a real Python import would find them -- which, for this project's editable
# install (`pip install -e ".[dev]"`, see Dockerfile), goes through the generated
# `_editable_impl_tradingos.pth` finder in site-packages, not the local `/app/src` tree
# directly. That resolution proved environment-dependent: a real GitHub Actions run failed with
# "Cannot find implementation or library stub for module named src.data.datalake.query" for
# imports that resolved fine in the local dev container. Setting mypy_path to the project root
# plus explicit_package_bases makes mypy resolve `src.*` imports directly from the local file
# tree every time, regardless of the installed editable package's own resolution mechanism.
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "vectorbt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hvac.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
