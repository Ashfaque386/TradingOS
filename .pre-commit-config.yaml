# REL-001 E1.1 exit criterion: Ruff + Black + mypy --strict enforced at commit time, not just
# manually/in CI. Every hook shells out to the real `app` Docker image (`docker compose run --rm
# app <tool>`) instead of installing ruff/black/mypy on the host -- this project's Docker-only
# rule applies to the actual checks, not to `pre-commit` itself (a thin git-hook orchestrator
# that has to run on the host by definition, the same way `git` itself does).
#
# Requires `docker compose up -d postgres qdrant redis` already running (same assumption every
# other script in this repo makes -- scripts/run_daily_shadow_mode.py, scripts/backup_data_lake.py
# -- since `docker compose run --rm app` waits on the `app` service's `depends_on` health checks).
#
# Install once per clone: `pip install pre-commit && pre-commit install` (host Python -- this is
# the one real exception to "no local Python" in this project, matching pre-commit's own nature).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint (docker compose run --rm app ruff check src tests)
        entry: docker compose run --rm app ruff check src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: black
        name: Black format check (docker compose run --rm app black --check src tests)
        entry: docker compose run --rm app black --check src tests
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy --strict (docker compose run --rm app mypy src)
        entry: docker compose run --rm app mypy src
        language: system
        pass_filenames: false
        always_run: true
      - id: bandit
        name: Bandit SAST (docker compose run --rm app bandit -c pyproject.toml -r src)
        entry: docker compose run --rm app bandit -c pyproject.toml -r src
        language: system
        pass_filenames: false
        always_run: true
      # REL-009 E9.3: gitleaks has no place in this project's `app` image (it's a standalone Go
      # binary, not a Python dependency) -- runs via its own official Docker image instead,
      # keeping the same "every real check runs in Docker, nothing installed on the host" rule
      # the three hooks above already established.
      - id: gitleaks
        name: gitleaks secrets scan (docker run zricethezav/gitleaks)
        # Deliberately NOT --no-git: that mode scans the raw filesystem and ignores .gitignore
        # entirely -- confirmed for real during REL-009 E9.3's own verification, it flags
        # legitimate local secrets sitting in already-gitignored paths (.env, /certs/,
        # frontend/.next/) that could never actually reach a commit. Git-aware mode (this
        # invocation) scans the real git history/tracked content instead, matching what
        # actually gets committed -- 0 findings against this repo's real history, confirmed.
        # Runs via scripts/run_gitleaks.sh, not an inline `${PWD}` substitution -- real bug found
        # running this hook on Windows: pre-commit's "system" hooks don't shell-expand `${PWD}`,
        # so it was passed to `docker run -v` as the literal string. See that script's own
        # comment for the exact confirmed error.
        entry: bash scripts/run_gitleaks.sh
        language: system
        pass_filenames: false
        always_run: true
