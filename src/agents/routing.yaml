# Task-type -> ordered fallback chain of (provider, model) pairs (Phase 2 E2.2).
# Edit this file to change which model handles a task type, reorder providers, or add a new
# fallback entry -- no code change or restart needed; src/agents/llm_router.py reads it fresh
# on every complete() call, same pattern as src/agents/prompts/registry.yaml.
#
# `ollama` needs no key and is deliberately kept as a last-resort entry in every chain so a
# call always has somewhere to land in dev, even before any cloud provider key is configured.
#
# 2026-07-25 (REL-005 live E2E verification): `huggingface` (meta-llama/Llama-3.3-70B-Instruct,
# already real and verified working -- Phase 2 E2.2) was promoted ahead of `opencode` in every
# chain below. `opencode`'s configured key has no payment method attached (real
# AuthenticationError, not a code bug) and Ollama's local fallback was timing out at the full
# 600s per call on this machine -- together these made a real end-to-end graph run take 10+
# minutes per node just to fail through both. huggingface is free, real, and fast; kept as a
# free alternative ahead of the paid/slow entries, which stay in the chain as further fallbacks.
#
# 2026-07-30 (user request, HuggingFace Pro billing now enabled): huggingface promoted ahead of
# `ollama` in every chain below (was already true everywhere except `sentiment`, fixed here) --
# `ollama` (local) now stays only as the absolute last-resort entry in every chain, not a
# primary choice, matching "use huggingface instead of local for every task type." Real usage
# stays bounded by src/agents/llm_router.py's `_hf_usage_tracker`
# (Settings.hf_daily_token_budget/hf_max_tokens_per_call) -- once that budget is hit for the day,
# huggingface is treated as unconfigured and these chains fall through to `ollama` automatically.
coding:
  - provider: anthropic
    model: claude-3-7-sonnet-20250219
  - provider: deepseek
    model: deepseek-reasoner
  - provider: huggingface
    model: meta-llama/Llama-3.3-70B-Instruct
  - provider: opencode
    model: claude-opus-4-8
  - provider: ollama
    model: deepseek-r1:latest
orchestration:
  - provider: openai
    model: gpt-4o
  - provider: huggingface
    model: meta-llama/Llama-3.3-70B-Instruct
  - provider: opencode
    model: gpt-5.4-nano
  - provider: ollama
    model: deepseek-r1:latest
sentiment:
  - provider: huggingface
    model: meta-llama/Llama-3.3-70B-Instruct
  - provider: gemini
    model: gemini-1.5-flash
  - provider: ollama
    model: deepseek-r1:latest
research:
  - provider: openai
    model: gpt-4o
  - provider: anthropic
    model: claude-3-7-sonnet-20250219
  - provider: gemini
    model: gemini-1.5-pro
  # 2026-08-07 (REL-030 live verification): a real DeepSeek key was added specifically because
  # huggingface/opencode/ollama (the only providers previously configured for this task type)
  # were all genuinely down at once -- huggingface out of monthly credits, opencode missing a
  # payment method, ollama timing out at 600s. Placed ahead of that trio since deepseek is real,
  # paid, and known-working (already used in the `coding` chain above).
  - provider: deepseek
    model: deepseek-reasoner
  - provider: huggingface
    model: meta-llama/Llama-3.3-70B-Instruct
  - provider: opencode
    model: gpt-5.4-nano
  - provider: ollama
    model: deepseek-r1:latest
chat:
  - provider: openai
    model: gpt-4o
  - provider: anthropic
    model: claude-3-7-sonnet-20250219
  - provider: huggingface
    model: meta-llama/Llama-3.3-70B-Instruct
  - provider: opencode
    model: gpt-5.4-nano
  - provider: ollama
    model: deepseek-r1:latest
